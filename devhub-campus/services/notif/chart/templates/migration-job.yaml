apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "notif.fullname" . }}-migration
  labels:
    {{- include "notif.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-2"
spec:
  template:
    metadata:
      labels:
        {{- include "notif.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: busybox:1.36
          command: ["sh", "-c", "echo migration ok"]
  backoffLimit: 1
