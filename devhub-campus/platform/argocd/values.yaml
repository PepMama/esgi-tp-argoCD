# Values Helm pour installer ArgoCD lui-même (chart argo/argo-cd).
# Ce fichier est consommé par `make argocd-install`.

# UI ArgoCD exposée via ingress-nginx sur argocd.devhub.local.
global:
  domain: argocd.devhub.local

configs:
  params:
    # Désactive le TLS interne : l'ingress-nginx est devant en HTTP local.
    server.insecure: true

  cm:
    timeout.reconciliation: 180s
    accounts.developer: login, apiKey
    accounts.platform-admin: login, apiKey

  rbac:
    policy.default: ""
    policy.csv: |
      p, role:developer, applications, get, devhub/*, allow
      p, role:developer, applications, sync, devhub/notif-*, allow
      p, role:developer, logs, get, devhub/notif-*, allow
      p, role:platform-admin, *, *, *, allow
      g, developer, role:developer
      g, platform-admin, role:platform-admin

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.devhub.local
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
    tls: false

# Garde-fou ressources : utile en TP pour ne pas saturer la machine.
controller:
  resources:
    requests: { cpu: "50m", memory: "256Mi" }
    limits:   { cpu: "1",   memory: "1Gi" }

repoServer:
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
